# DrugCentral DRS API v2 -> container on 127.0.0.1:8007 (deploy/chiltepin/compose.yml).
#
# Install as root:
#   cp deploy/chiltepin/apache-drugcentral-drs-api.conf /etc/apache2/sites-available/drugcentral-drs-api.conf
# then add this line inside the :80 and :443 virtual hosts in
# /etc/apache2/sites-enabled/000-default.conf and 000-default-le-ssl.conf:
#   Include /etc/apache2/sites-available/drugcentral-drs-api.conf
# and reload:
#   apache2ctl configtest && systemctl reload apache2
#
# Serves:  https://chiltepin.health.unm.edu/drs/  (docs at /drs/docs)

ProxyPreserveHost On

# /drs -> /drs/ so relative links in the docs page resolve.
RedirectMatch ^/drs$ /drs/

# The prefix is stripped here; uvicorn runs with --root-path /drs so generated
# URLs (docs, openapi.json) keep it.
ProxyPass /drs/ http://127.0.0.1:8007/
ProxyPassReverse /drs/ http://127.0.0.1:8007/
